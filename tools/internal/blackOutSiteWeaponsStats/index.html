<div class="weapon-page">
    <div class="filter-container">
        <button id="filterButton">
            Filters ▼
        </button>

        <div id="filterMenu" class="filter-menu">
            <label>
                <input type="checkbox" id="filterObtainable">
                Obtainable
            </label>

            <hr>

            <strong>Chaos team kits I Have:</strong>

            <div id="kitFilters"></div>
        </div>
    </div>

    <table class="weapon-table" id="weaponTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Tier</th>

                <th class="sortable" data-sort="dps">
                    Damage Per Second <span class="sort-icon">↕</span>
                </th>

                <th class="sortable" data-sort="damage">
                    Attack Damage <span class="sort-icon">↕</span>
                </th>

                <th class="sortable" data-sort="attackSpeed">
                    Attack Speed <span class="sort-icon">↕</span>
                </th>

                <th>How To Get?</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h>WARNING: Serpents-Hand and Serpent-Monarch are not added.</h>

</div>
